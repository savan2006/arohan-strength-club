spring:
  config:
    import:
      # Support running from either the backend folder or the repository root.
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  application:
    name: arohan-strength-club-api

  threads:
    virtual:
      # Java 21 virtual threads: request threads waiting on the (remote) database no longer block a platform thread.
      enabled: true

  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/arohan_strength_club}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
        # Loads lazy collections (plan days, day exercises, session exercises, plan features) in batches
        # instead of one query per parent row. Biggest win when the database is a network hop away.
        default_batch_fetch_size: 32
        format_sql: false

  flyway:
    enabled: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt:
    # There is intentionally no development secret fallback. Set JWT_SECRET in the environment.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

  timezone: ${APP_TIMEZONE:Asia/Kolkata}

  seed-admin:
    email: ${APP_SEED_ADMIN_EMAIL:}
    password: ${APP_SEED_ADMIN_PASSWORD:}
    name: ${APP_SEED_ADMIN_NAME:AROHAN Administrator}

logging:
  level:
    root: INFO
    com.arohan.strengthclub: INFO
