      <!-- Thigh & Calf -->
      <line x1="35" y1="45" x2="52" y2="48" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
      <line x1="52" y1="48" x2="48" y2="68" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="68" x2="58" y2="68" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
      <!-- Barbell on shoulders -->
      <line x1="15" y1="25" x2="65" y2="25" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      <rect x="18" y="17" width="5" height="16" rx="1" fill="#10B981"/>
      <rect x="57" y="17" width="5" height="16" rx="1" fill="#10B981"/>
    
  </g>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">SQUATS</text>
</svg>