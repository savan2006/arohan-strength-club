<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="8" y="8" width="104" height="104" rx="8" fill="#FFFFFF"/>
  <g transform="translate(20, 20)">
    
      <!-- Machine Base & Cable -->
      <line x1="12" y1="45" x2="42" y2="45" stroke="#64748B" stroke-width="2" stroke-dasharray="3,2"/>
      <rect x="10" y="35" width="5" height="20" fill="#0F172A"/>
      <!-- Seated Lifter -->
      <circle cx="56" cy="30" r="5" fill="#10B981"/>
      <line x1="56" y1="35" x2="54" y2="58" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
      <!-- Extended Arms Pulling -->
      <line x1="54" y1="40" x2="38" y2="45" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
      <!-- Legs -->
      <line x1="54" y1="58" x2="32" y2="58" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    
  </g>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">CABLE ROW</text>
</svg>