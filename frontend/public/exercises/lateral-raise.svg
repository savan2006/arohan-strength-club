<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="8" y="8" width="104" height="104" rx="8" fill="#FFFFFF"/>
  <g transform="translate(20, 20)">
    
      <!-- Lifter Standing -->
      <circle cx="40" cy="25" r="5" fill="#10B981"/>
      <line x1="40" y1="30" x2="40" y2="65" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
      <!-- Outstretched Arms -->
      <path d="M 40 35 Q 26 36 15 36" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 40 35 Q 54 36 65 36" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Weights -->
      <circle cx="15" cy="36" r="4" fill="#0F172A"/>
      <circle cx="65" cy="36" r="4" fill="#0F172A"/>
    
  </g>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">LATERAL RAISE</text>
</svg>