<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="8" y="8" width="104" height="104" rx="8" fill="#FFFFFF"/>
  <g transform="translate(20, 20)">
    
      <!-- Cable Frame -->
      <line x1="28" y1="12" x2="28" y2="28" stroke="#64748B" stroke-width="2"/>
      <circle cx="28" cy="12" r="3" fill="#0F172A"/>
      <!-- Lifter Standing -->
      <circle cx="48" cy="25" r="5" fill="#10B981"/>
      <line x1="48" y1="30" x2="48" y2="65" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
      <!-- Upper arm pinned, forearm pressing down -->
      <line x1="48" y1="35" x2="44" y2="46" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      <line x1="44" y1="46" x2="32" y2="46" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
      <!-- Rope Attachment -->
      <line x1="28" y1="28" x2="32" y2="46" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    
  </g>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">TRICEPS PUSHDOWN</text>
</svg>